name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm coverage
      # Publish only when NPM_TOKEN is set. Without it, changesets/action falls back to
      # npm OIDC trusted publishing, which cannot create a brand-new package (E404).
      # Do not enable provenance while the GitHub repo is private — npm rejects it
      # (often as a misleading E404). Re-enable NPM_CONFIG_PROVENANCE after going public.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: pnpm version-packages
          publish: ${{ secrets.NPM_TOKEN != '' && 'pnpm changeset publish' || '' }}
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
